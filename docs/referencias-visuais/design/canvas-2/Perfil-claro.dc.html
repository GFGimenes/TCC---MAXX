<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MAXX · Perfil (claro)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=Instrument+Sans:wdth,wght@75..100,400..700&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif}
.dsp{font-family:'Archivo',system-ui,sans-serif;font-stretch:112.5%}
button{font:inherit;color:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
.tier-bronze{background:linear-gradient(105deg,#C9621F 0%,#EE8A45 30%,#F9C4A0 46%,#EE8A45 60%,#D8712C 100%)}
.tier-prata{background:linear-gradient(105deg,#9C9C9C 0%,#CFCFCF 30%,#F1F1F1 46%,#CFCFCF 60%,#A9A9A9 100%)}
.tier-ouro{background:linear-gradient(105deg,#D99A12 0%,#FBC43A 30%,#FFE08A 46%,#FBC43A 60%,#DDA11A 100%)}
.tier-diamante{background:linear-gradient(105deg,#5FB6DE 0%,#A9E2F5 30%,#F4FDFF 46%,#B7C6F5 62%,#6FA9E6 100%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}">
  <main style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; box-sizing: border-box; padding-bottom: 115px">
    <header style="position: sticky; top: 0; z-index: 3; height: 91px; box-sizing: border-box; padding: 47px 4px 0 16px; background: {{t.bg}}; display: flex; align-items: center; justify-content: space-between">
      <h1 class="dsp" style="margin: 0; font-size: 20px; line-height: 24px; font-weight: 700">ana.souza</h1>
      <div style="display: flex">
        <button type="button" aria-label="Nova publicação" style="width: 44px; height: 44px; background: none; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><path d="M12 8v8M8 12h8"></path></svg></button>
        <button type="button" aria-label="Menu" style="width: 44px; height: 44px; background: none; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
      </div>
    </header>

    <section aria-label="Resumo do perfil" style="padding: 8px 16px 0; display: flex; align-items: center; gap: 16px">
      <span class="dsp" style="width: 80px; height: 80px; flex-shrink: 0; border-radius: 8px; background: {{t.surface}}; border: 1px solid {{t.line}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 28px; line-height: 32px; font-weight: 700">AS</span>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); text-align: center">
        <a href="{{links.rankings}}" aria-label="15.020 pontos, ver rankings" style="min-height: 44px; display: flex; flex-direction: column; justify-content: center">
          <span class="dsp" style="font-size: 16px; line-height: 22px; font-weight: 700">15.020</span>
          <span style="font-size: 13px; line-height: 18px; color: {{t.text2}}">pontos</span>
        </a>
        <a href="{{links.rankings}}" aria-label="Posição 29 no geral, ver rankings" style="min-height: 44px; display: flex; flex-direction: column; justify-content: center">
          <span class="dsp" style="font-size: 16px; line-height: 22px; font-weight: 700">#29</span>
          <span style="font-size: 13px; line-height: 18px; color: {{t.text2}}">no geral</span>
        </a>
        <a href="#" style="min-height: 44px; display: flex; flex-direction: column; justify-content: center">
          <span class="dsp" style="font-size: 16px; line-height: 22px; font-weight: 700">1.234</span>
          <span style="font-size: 13px; line-height: 18px; color: {{t.text2}}">seguidores</span>
        </a>
        <a href="#" style="min-height: 44px; display: flex; flex-direction: column; justify-content: center">
          <span class="dsp" style="font-size: 16px; line-height: 22px; font-weight: 700">231</span>
          <span style="font-size: 13px; line-height: 18px; color: {{t.text2}}">seguindo</span>
        </a>
      </div>
    </section>

    <section aria-label="Sobre" style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 4px">
      <p class="dsp" style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600">Ana Souza</p>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: {{t.text2}}">Análise e Desenvolvimento de Sistemas · 3º semestre · UniMax</p>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
        <span style="font-size: 13px; line-height: 18px; color: {{t.text2}}">Último troféu</span>
        <span class="tier-diamante" style="height: 22px; padding: 0 10px 0 6px; border-radius: 999px; display: flex; align-items: center; gap: 4px; color: #0B1D33; font-size: 11px; line-height: 14px; font-weight: 700">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4.5a2.5 2.5 0 0 0 2.9 3.9M17 6h2.5a2.5 2.5 0 0 1-2.9 3.9"></path><path d="M12 14v3.5M8.5 20.5h7M9.5 17.5h5"></path></svg>
          Pássaro Raro no Campus
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
        <span aria-hidden="true" style="display: flex">
          <span class="dsp" style="width: 20px; height: 20px; border-radius: 8px; background: {{t.surface}}; border: 1px solid {{t.bg}}; display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 700">MC</span>
          <span class="dsp" style="width: 20px; height: 20px; margin-left: -6px; border-radius: 8px; background: {{t.surface}}; border: 1px solid {{t.bg}}; display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 700">JL</span>
        </span>
        <span style="font-size: 13px; line-height: 18px; color: {{t.text2}}">Seguida por <span style="font-weight: 600; color: {{t.text}}">maria.costa</span> e <span style="font-weight: 600; color: {{t.text}}">joao.lima</span></span>
      </div>
    </section>

    <div style="padding: 8px 16px 0; display: flex; gap: 8px">
      <button type="button" style="flex-grow: 1; flex-basis: 0; height: 44px; padding: 6px 0; background: none; border: 0"><span style="height: 32px; border-radius: 8px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 18px; font-weight: 600; color: {{t.text}}">Editar perfil</span></button>
      <button type="button" style="flex-grow: 1; flex-basis: 0; height: 44px; padding: 6px 0; background: none; border: 0"><span style="height: 32px; border-radius: 8px; background: {{t.surface}}; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 18px; font-weight: 600; color: {{t.text}}">Compartilhar perfil</span></button>
    </div>

    <div role="tablist" aria-label="Conteúdo do perfil" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid {{t.line}}">
      <button type="button" role="tab" aria-selected="true" aria-label="Publicações" style="height: 44px; background: none; border: 0; border-bottom: 1px solid {{t.text}}; margin-bottom: -1px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"></rect><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"></path></svg></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Troféus" style="height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; color: {{t.text2}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4.5a2.5 2.5 0 0 0 2.9 3.9M17 6h2.5a2.5 2.5 0 0 1-2.9 3.9"></path><path d="M12 14v3.5M8.5 20.5h7M9.5 17.5h5"></path></svg></button>
      <button type="button" role="tab" aria-selected="false" aria-label="Medalhas" style="height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; color: {{t.text2}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3 11 8.6M15.5 3 13 8.6"></path><circle cx="12" cy="14.5" r="6"></circle><circle cx="12" cy="14.5" r="2.5"></circle></svg></button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; margin-top: 2px">
      <sc-for list="{{ tiles }}" as="item" hint-placeholder-count="9">
        <a href="#" aria-label="{{ item.label }}" class="{{ item.tier }}" style="aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #0B1D33">
          <sc-if value="{{ item.photo }}" hint-placeholder-val="{{ false }}"><img src="assets/foto-exemplo.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
          <sc-if value="{{ item.trophy }}" hint-placeholder-val="{{ true }}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 6H4.5a2.5 2.5 0 0 0 2.9 3.9M17 6h2.5a2.5 2.5 0 0 1-2.9 3.9"></path><path d="M12 14v3.5M8.5 20.5h7M9.5 17.5h5"></path></svg></sc-if>
          <sc-if value="{{ item.medal }}" hint-placeholder-val="{{ false }}"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 3 11 8.6M15.5 3 13 8.6"></path><circle cx="12" cy="14.5" r="6"></circle><circle cx="12" cy="14.5" r="2.5"></circle></svg></sc-if>
        </a>
      </sc-for>
    </div>
  </main>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; height: 83px; box-sizing: border-box; padding: 0 8px; background: {{t.bg}}; border-top: 1px solid {{t.line}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; justify-items: center">
    <a href="{{links.feed}}" aria-label="Home" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="{{nav.home}}" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.2 12 3.5l8.5 6.7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"></path></svg></a>
    <button type="button" aria-label="Busca" style="width: 48px; height: 48px; background: none; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20.5 20.5-4.5-4.5"></path></svg></button>
    <a href="{{links.mural}}" aria-label="Mural" style="width: 52px; height: 52px; margin-top: -14px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: {{t.fab}}; color: {{t.fabIcon}}; box-shadow: {{t.fabShadow}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2"></rect><rect x="6.5" y="8" width="5" height="4.5" rx="0.5"></rect><path d="M14.5 8.5h3M14.5 12h3M6.5 16h11"></path></svg></a>
    <a href="{{links.trofeus}}" aria-label="Troféus" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="{{nav.trofeus}}"></path><path d="M7 6H4.5a2.5 2.5 0 0 0 2.9 3.9M17 6h2.5a2.5 2.5 0 0 1-2.9 3.9"></path><path d="M12 14v3.5M8.5 20.5h7M9.5 17.5h5"></path></svg></a>
    <a href="{{links.perfil}}" aria-label="Perfil" aria-current="page" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 8px; border: 2px solid {{nav.ring}}; padding: 2px; display: flex">
        <span class="dsp" style="flex-grow: 1; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: {{t.text}}">AS</span>
      </span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#022D57', surface: '#0A3867', line: '#1D5188', action: '#FAB301', onAction: '#022D57', text: '#F2F5FA', text2: '#A8B8CE', goldText: '#FAB301', link: '#8DBBEE', like: '#E0243A', fab: '#FAB301', fabIcon: '#022D57', fabShadow: '0 6px 16px rgba(0, 0, 0, 0.35)' }
      : { bg: '#FFFFFF', surface: '#F0F3F8', line: '#DCE2EB', action: '#022D57', onAction: '#FFFFFF', text: '#0B1D33', text2: '#4D5B70', goldText: '#8A5A00', link: '#2F6FBF', like: '#E0243A', fab: '#022D57', fabIcon: '#FFFFFF', fabShadow: '0 6px 16px rgba(2, 45, 87, 0.30)' };
    const s = dark ? '-escuro' : '-claro';
    const links = { feed: 'Feed' + s + '.dc.html', perfil: 'Perfil' + s + '.dc.html', mural: 'Mural' + s + '.dc.html', trofeus: 'Trofeus' + s + '.dc.html', rankings: 'Rankings' + s + '.dc.html' };
    const active = 'perfil';
    const nav = {
      home: active === 'feed' ? 'currentColor' : 'none',
      trofeus: active === 'trofeus' ? 'currentColor' : 'none',
      ring: active === 'perfil' ? t.text : 'transparent'
    };
    const tile = (label, tier, kind) => ({ label, tier: tier ? 'tier-' + tier : '', photo: kind === 'photo', trophy: kind === 'trophy', medal: kind === 'medal' });
    const tiles = [
      tile('Post: Pássaro Raro no Campus, troféu Diamante', '', 'photo'),
      tile('Troféu Top 2% Integrativa, Ouro', 'ouro', 'trophy'),
      tile('Troféu Techday 2026, Ouro', 'ouro', 'trophy'),
      tile('Troféu Média 10 em uma matéria, Ouro', 'ouro', 'trophy'),
      tile('Medalha Participação no seminário, Prata', 'prata', 'medal'),
      tile('Troféu Assiduidade semestral, Prata', 'prata', 'trophy'),
      tile('Troféu 10 medalhas, Bronze', 'bronze', 'trophy'),
      tile('Troféu Média 10 em uma matéria, Prata', 'prata', 'trophy'),
      tile('Troféu Média 10 em uma matéria, Bronze', 'bronze', 'trophy')
    ];
    return { t, links, nav, tiles };
  }
}
</script>
</body>
</html>
