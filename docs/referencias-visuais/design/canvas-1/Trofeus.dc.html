<style>
body{margin:0;font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;background:#1c1c1c}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
input{font:inherit}
input::placeholder{color:var(--ink-3)}

.disp{font-family:'Archivo','Arial Narrow',sans-serif;font-stretch:112%}
.num{font-variant-numeric:tabular-nums}
.ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.med{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,0.16)}

.m-bronze{--edge:#A2602F;color:#5A2C0E;background:radial-gradient(circle at 50% 30%,#EBB58D 0%,#D08C5A 55%,#B06B38 100%)}
.m-prata{--edge:#959CA5;color:#3A414A;background:radial-gradient(circle at 50% 30%,#F1F3F5 0%,#C9CED4 55%,#A7ADB5 100%)}
.m-ouro{--edge:#C99300;color:#6B4700;background:radial-gradient(circle at 50% 30%,#FFDE6E 0%,#F3BD24 55%,#DDA200 100%)}
.m-diamante{--edge:#3F9DC6;color:#0F4766;background:radial-gradient(circle at 50% 30%,#CDF1FA 0%,#86D2EC 55%,#52AFD6 100%)}
.m-next{box-shadow:none;border:2px dashed var(--ink-2);background:transparent;color:var(--ink-2)}
.m-next::after{display:none}
.r-raro,.r-epico,.r-lendario{outline:1.5px solid var(--rar);outline-offset:3px}
.r-epico::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1.5px solid var(--rar);pointer-events:none}
.r-lendario::before{content:'';position:absolute;inset:-10.5px;border-radius:50%;background:repeating-conic-gradient(var(--rar) 0deg 4deg,transparent 4deg 12deg);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));mask:radial-gradient(closest-side,transparent calc(100% - 4px),#000 calc(100% - 4px));pointer-events:none}
.tile-bronze{background:linear-gradient(160deg,#F6DCC7 0%,#D69A6C 100%)}
.tile-prata{background:linear-gradient(160deg,#F4F5F7 0%,#C9CED4 100%)}
.tile-ouro{background:linear-gradient(160deg,#FFEAA6 0%,#F2BA1E 100%)}
.tile-diamante{background:linear-gradient(160deg,#DDF5FC 0%,#8BD2EC 100%)}
.th-dark .tile-bronze{background:linear-gradient(160deg,#6A3E24 0%,#3A2013 100%)}
.th-dark .tile-prata{background:linear-gradient(160deg,#4A5463 0%,#252D39 100%)}
.th-dark .tile-ouro{background:linear-gradient(160deg,#6E5209 0%,#3A2B06 100%)}
.th-dark .tile-diamante{background:linear-gradient(160deg,#1F5A7E 0%,#0E3350 100%)}

.tt-bronze{color:#9A4F1C}.tt-prata{color:#5E6670}.tt-ouro{color:#8A6200}.tt-diamante{color:#1B6E99}

.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--surface-2);position:relative;margin:0;cursor:pointer;flex-shrink:0;transition:background .15s}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'trofeus', showMissing: true };
}
renderVals() {
var self = this;
var s = this.state;
var tiers = { bronze: 'Bronze', prata: 'Prata', ouro: 'Ouro', diamante: 'Diamante' };
function mk(kind, name, tier, pts, rarity, got, note, isNew) {
return { name: name, medClass: got ? 'm-' + tier + ({ 'Comum': '', 'Raro': ' r-raro', 'Épico': ' r-epico', 'Lendário': ' r-lendario' })[rarity] : 'm-next', ttClass: 'tt-' + tier, tierLabel: tiers[tier], pts: pts, rarity: rarity, got: got, missing: !got, isTrophy: kind === 't', isMedal: kind === 'm', note: note, isNew: !!isNew };
}
var all = {
trofeus: [
mk('t', 'Pássaro Raro no Campus', 'diamante', 150, 'Lendário', true, 'Exige foto · validada pela coordenação', true),
mk('t', 'Top 2% Integrativa', 'ouro', 95, 'Raro', true, 'Regra automática · prova integrativa'),
mk('t', 'Techday 2026', 'ouro', 80, 'Raro', true, 'Instituição · Techday 2026'),
mk('t', 'Assiduidade semestral', 'prata', 50, 'Comum', true, 'Regra automática · presença de 100%'),
mk('t', '10 medalhas', 'bronze', 25, 'Comum', false, 'Acúmulo · receba 10 medalhas')
],
medalhas: [
mk('m', 'Participação no seminário', 'prata', 40, 'Comum', true, 'Dada pela Prof. Carla Mendes'),
mk('m', 'Apresentação de TCC', 'diamante', 120, 'Épico', false, 'Dada por professor')
]
};
var items = all[s.tab].filter(function (it) { return it.got || s.showMissing; });
var tabs = [{ key: 'trofeus', label: 'Troféus' }, { key: 'medalhas', label: 'Medalhas' }].map(function (t) {
var on = s.tab === t.key;
return { label: t.label, on: on, off: !on, selected: on ? 'true' : 'false', pick: function () { self.setState({ tab: t.key }); } };
});
return {
tabs: tabs,
items: items,
isTrofeus: s.tab === 'trofeus',
showMissing: s.showMissing,
toggleMissing: function () { self.setState({ showMissing: !self.state.showMissing }); }
};
}
}
</script>
